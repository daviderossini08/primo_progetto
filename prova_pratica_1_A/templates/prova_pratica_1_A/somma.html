<!DOCTYPE html>
{% extends "base.html"%}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%} {{block.super}} | Somma {%endblock title%}</title>
</head>
<body>
    {%block content%}
    <h1>Somma:</h1>
        <ol>
            {% if var1 < var2 %}
                <p><i style= "color: red;">{{ var1 }} </i> <i>+</i> <i style= "color: green;"> {{ var2 }} </i><i>= {{ somma }} </i></p>
            {% endif %}
            {% if var2 < var2 %}
                <p><i style= "color: green;" >{{ var1 }} </i> <i>+</i> <i style= "color: red;"> {{ var2 }} </i><i>= {{ somma }}</i></p>
            {% endif %}
        </ol>
    {%endblock content%}
</body>
</html>
